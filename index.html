<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Critical CSS: paints the linen background + system-font body text
         before the Tailwind bundle parses, improving First Contentful Paint.
         Values mirror :root tokens and the body rule in src/index.css. -->
    <style>
      html, body { margin: 0; background: hsl(39 32% 90%); color: hsl(26 21% 20%); }
      body { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 18px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
      #root { min-height: 100vh; }
    </style>

    <!-- Warm the Unsplash connection alongside the hero image preload below. -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Google tag (gtag.js) — SPA: pageviews fired manually per route in src/components/analytics/Analytics.tsx
         Loaded after window 'load' to keep ~156KB of analytics JS off the critical path (FCP/LCP).
         dataLayer + gtag shim are defined synchronously so route-change events queued before the
         script loads are buffered and replayed by gtag.js once it initializes. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('js', new Date());
      gtag('config', 'G-93DFWMX8GP', { send_page_view: false });
      window.addEventListener('load', function () {
        setTimeout(function () {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-93DFWMX8GP';
          document.head.appendChild(s);
        }, 0);
      });
    </script>
    <title>Deepgrain | Work with the grain.</title>
    <meta name="description" content="Organisational consultancy. Deepgrain reads how your organisation actually works, then builds what lasts." />
    <meta name="author" content="Deepgrain" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://deepgrain.ai/" />
    <link rel="alternate" type="text/plain" title="llms.txt" href="https://deepgrain.ai/llms.txt" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="https://deepgrain.ai/sitemap.xml" />
    <link rel="alternate" type="application/rss+xml" title="Deepgrain Intelligence" href="https://deepgrain.ai/feed.xml" />
    <link rel="alternate" type="application/rss+xml" title="Deepgrain People Ops AI" href="https://deepgrain.ai/feed/people-ops.xml" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1F3A2E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Deepgrain" />

    <!-- Search engine site verification.
         Replace each content="..." value with the code from the console,
         then redeploy. Leaving the placeholder is harmless: verification
         just stays pending. See docs/seo-console-setup.md for the steps. -->
    <meta name="google-site-verification" content="REPLACE_WITH_GOOGLE_SITE_VERIFICATION_CODE" />
    <meta name="msvalidate.01" content="REPLACE_WITH_BING_VERIFICATION_CODE" />

    <!-- Hero LCP image. Quality lowered to q=45 because the image sits under
         a green/55 overlay + gradient — detail is invisible, bytes are not.
         Cuts ~30% transfer vs q=55/60 with no perceptible visual change. -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1200&q=45&fm=webp"
      imagesrcset="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=400&q=45&fm=webp 400w, https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=640&q=45&fm=webp 640w, https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1200&q=45&fm=webp 1200w, https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1600&q=50&fm=webp 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
    </noscript>

    <meta property="og:title" content="Deepgrain | Work with the grain." />
    <meta property="og:description" content="Every organisation has a grain. Most have never read it. Deepgrain reads it first. Then builds." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://deepgrain.ai/" />
    <meta property="og:image" content="https://deepgrain.ai/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Deepgrain | Work with the grain." />
    <meta name="twitter:description" content="Organisational consultancy that reads the grain of how your organisation actually works." />
    <meta name="twitter:image" content="https://deepgrain.ai/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://deepgrain.ai/#organization",
            "name": "Deepgrain",
            "url": "https://deepgrain.ai/",
            "logo": "https://deepgrain.ai/og-image.png",
            "founder": { "@type": "Person", "name": "Matthew Bradburn" },
            "email": "matt@deepgrain.ai",
            "description": "Organisational consultancy that reads the grain of how a company actually operates — then changes it without breaking what works."
          },
          {
            "@type": "WebSite",
            "@id": "https://deepgrain.ai/#website",
            "url": "https://deepgrain.ai/",
            "name": "Deepgrain",
            "publisher": { "@id": "https://deepgrain.ai/#organization" },
            "inLanguage": "en-GB"
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
